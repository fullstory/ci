name: deb

# Build a Debian source with sbuild in a clean sid chroot for amd64 and
# arm64, attest every file and upload them as the artifacts deb-amd64 and
# deb-arm64. Callers grant contents: read, id-token: write, attestations:
# write and artifact-metadata: write; their release job needs contents: write.

on:
  workflow_call:
    inputs:
      repository:
        description: owner/repo to build; the caller when empty
        type: string
        default: ''
      ref:
        description: branch, tag or commit; a debian/* tag must match the changelog
        type: string
        required: true
      version:
        description: version to set with dch before the build
        type: string
        default: ''
      prepare:
        description: shell run in the source as root before dpkg-source -b, e.g. to fetch a quilt package's orig; what it installs never reaches the build
        type: string
        default: ''
      piuparts:
        description: test installing and purging the binaries with piuparts; reports only
        type: boolean
        default: true
      autopkgtest:
        description: run debian/tests with autopkgtest; reports only
        type: boolean
        default: true
      dev-repo:
        description: let piuparts install from kel-mo/apt too, for binaries that depend on other aptosid packages
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    name: build ${{ matrix.arch }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # source + arch:all + amd64
          - arch: amd64
            runner: ubuntu-26.04
            sbuild: --source --force-orig-source --arch-all --arch-any
            files: |
              out/*.changes
              out/*.buildinfo
              out/*.dsc
              out/*.tar.*
              out/*.deb
          # arm64 binaries only; never the source, whose orig both jobs may have fetched
          - arch: arm64
            runner: ubuntu-26.04-arm
            sbuild: --no-arch-all --arch-any
            files: |
              out/*.changes
              out/*.buildinfo
              out/*.deb
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:sid
      # sbuild's unshare mode needs user namespaces that can mount
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev passwd \
            sbuild mmdebstrap uidmap iproute2 zstd piuparts autopkgtest

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          path: src
          persist-credentials: false

      - name: Check the tag against the changelog
        working-directory: src
        env:
          REF: ${{ inputs.ref }}
        run: |
          case $REF in
            refs/tags/debian/*|debian/*) tag=${REF#refs/tags/} ;;
            *) exit 0 ;;
          esac
          # a debian/* branch
          if git rev-parse -q --verify "refs/remotes/origin/$tag" > /dev/null; then
            exit 0
          fi
          # DEP-14
          want=$(echo "${tag#debian/}" | tr '%_' ':~')
          have=$(dpkg-parsechangelog -SVersion)
          if [ "$want" != "$have" ]; then
            echo "::error::$tag is $want but debian/changelog says $have"
            exit 1
          fi

      - name: Set the version
        if: inputs.version != ''
        working-directory: src
        env:
          REPOSITORY: ${{ inputs.repository || github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          apt-get install -y --no-install-recommends devscripts
          # keep the changelog's maintainer
          DEBEMAIL=$(dpkg-parsechangelog -SMaintainer) \
            dch -b -v "$VERSION" -D UNRELEASED "CI build of $REPOSITORY@$(git rev-parse --short=7 HEAD)."

      - name: Prepare the source
        if: inputs.prepare != ''
        working-directory: src
        run: ${{ inputs.prepare }}

      - name: Build the source package
        run: dpkg-source -b src

      - name: Check for arch-dependent packages
        id: arch
        if: matrix.arch == 'arm64'
        run: |
          if [ "$(sed -n 's/^Architecture: *//p' *.dsc)" = all ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::no arch-dependent package for ${{ matrix.arch }}; arch:all comes from the amd64 build"
          fi

      - name: Set up sbuild
        if: steps.arch.outputs.skip != 'true'
        env:
          ARCH: ${{ matrix.arch }}
          DEV_REPO: ${{ inputs.dev-repo }}
        run: |
          # the runner's hardware, for comparing build times
          lscpu | grep -E '^(Model name|CPU\(s\)):'
          useradd -m builder
          grep -q '^builder:' /etc/subuid ||
            usermod --add-subuids 100000-165535 --add-subgids 100000-165535 builder
          # hosted runners restrict unprivileged user namespaces; the VM is thrown away
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          [ ! -e "$f" ] || echo 0 > "$f"
          install -d -o builder -g builder out
          runuser -u builder -- mkdir -p /home/builder/.cache/sbuild /home/builder/.config/sbuild
          cat > /home/builder/.config/sbuild/config.pl << 'EOF'
          $chroot_mode = 'unshare';
          $run_lintian = 1;
          $lintian_opts = ['--info'];
          $piuparts_opts = ['--no-eatmydata', '--distribution=%r', '--arch=%a',
            '--mirror=http://deb.debian.org/debian', '--fake-essential-packages=systemd-sysv',
            '--bootstrapcmd=mmdebstrap --skip=check/empty --variant=minbase', '--scriptsdir=/etc/piuparts/scripts'];
          $autopkgtest_opts = ['--apt-upgrade', '--', 'unshare', '--release', '%r', '--arch', '%a'];
          EOF
          if [ "$DEV_REPO" = true ]; then
            apt-get install -y --no-install-recommends curl gnupg
            install -d /srv/kel-mo-apt
            curl -fsSLo /srv/kel-mo-apt/kel-mo-apt.asc https://kel-mo.github.io/apt/kel-mo-apt.asc
            # kel-mo/apt's signing key, as in its README
            fpr=$(gpg --show-keys --with-colons /srv/kel-mo-apt/kel-mo-apt.asc | awk -F: '$1 == "fpr" { print $10; exit }')
            [ "$fpr" = B6F34F99EB56F0CB09A944242DF4B4E8ADBAF6E8 ] || { echo "::error::kel-mo/apt's key is '$fpr'"; exit 1; }
            cat >> /home/builder/.config/sbuild/config.pl << 'EOF'
          # https: ca-certificates must be in piuparts' base before its first apt-get update
          $piuparts_opts = [(grep { !/^--bootstrapcmd=/ } @$piuparts_opts),
            '--bootstrapcmd=mmdebstrap --skip=check/empty --variant=minbase --include=ca-certificates',
            '--bindmount=/srv/kel-mo-apt',
            '--extra-repo=deb [signed-by=/srv/kel-mo-apt/kel-mo-apt.asc] https://kel-mo.github.io/apt sid main'];
          EOF
          fi
          chown builder: /home/builder/.config/sbuild/config.pl
          runuser -u builder -- mmdebstrap --variant=buildd --skip=output/mknod --include=ca-certificates \
            unstable "/home/builder/.cache/sbuild/unstable-$ARCH.tar.zst" http://deb.debian.org/debian

      - name: Build
        id: build
        if: steps.arch.outputs.skip != 'true'
        working-directory: out
        run: |
          runuser -u builder -- sbuild --verbose -d unstable ${{ matrix.sbuild }} \
            ${{ inputs.piuparts && '--run-piuparts' || '--no-run-piuparts' }} \
            ${{ inputs.autopkgtest && '--run-autopkgtest' || '--no-run-autopkgtest' }} \
            ../*.dsc

      - name: Report
        if: always() && steps.build.outcome != 'skipped'
        working-directory: out
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          log=$(ls *_"$ARCH".build 2> /dev/null) || exit 0
          summary=$(grep -E '^(Status|Fail-Stage|Lintian|Piuparts|Autopkgtest):' "$log")
          # lintian's tags without their explanations
          tags=$(sed -n '/^Running lintian/,/^+-/p' "$log" | grep -E '^[EWIPX]: [^ ]+( [a-z]+)?: ' || true)
          # piuparts' failures and the lines that explain them
          fails=$(awk '/ERROR: FAIL: / { sub(/^[0-9m.s]+ /, ""); print; p = 1; next }
            p && /^[ \t]/ { print; next } { p = 0 }' "$log")
          {
            printf '### %s\n```\n%s\n```\n' "$ARCH" "$summary"
            [ -z "$tags" ] ||
              printf '<details><summary>lintian: %s tags</summary>\n\n```\n%s\n```\n</details>\n\n' \
                "$(echo "$tags" | wc -l)" "$tags"
            [ -z "$fails" ] || printf 'piuparts:\n```\n%s\n```\n' "$fails"
          } >> "$GITHUB_STEP_SUMMARY"
          # lintian, piuparts and autopkgtest report only
          echo "$tags" | sed -nE "s/^E: (.*)/::warning title=lintian $ARCH::\1/p; s/^W: (.*)/::notice title=lintian $ARCH::\1/p"
          echo "$summary" | sed -nE "s/^(Piuparts|Autopkgtest): (fail.*)/::warning::$ARCH \1: \2/p"
          echo "$fails" | awk -v t="piuparts $ARCH" '{ gsub(/%/, "%25"); gsub(/[ \t]+/, " ") }
            /^ERROR: FAIL: / { if (m != "") print "::warning title=" t "::" m; m = substr($0, 14); next }
            { sub(/^ /, ""); m = m "%0A" $0 }
            END { if (m != "") print "::warning title=" t "::" m }'

      - uses: actions/upload-artifact@v7
        if: steps.arch.outputs.skip != 'true'
        with:
          name: deb-${{ matrix.arch }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  attest:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: out
          merge-multiple: true

      - uses: actions/attest@v4
        with:
          subject-path: out/*
